<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Entrar — IBK KIDS Escalas</title>
<style>
  :root{--orange:#FF7A00;--orange-d:#E56800;--ink:#2B2A27;--muted:#75736B;--line:#E9E6DE;--page:#F7F6F2;--card:#fff;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--page);color:var(--ink);font-family:'Poppins','Segoe UI',Arial,sans-serif}
  form{width:100%;max-width:360px;background:var(--card);border-radius:16px;padding:28px 24px;box-shadow:0 1px 2px rgba(30,20,10,.04),0 6px 18px rgba(30,20,10,.08)}
  h1{margin:0 0 4px;font-size:20px}
  p{margin:0 0 20px;color:var(--muted);font-size:14px}
  label{display:block;margin:12px 0 4px;font-size:13px;font-weight:600}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit}
  input:focus{outline:2px solid var(--orange);outline-offset:1px}
  button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:10px;background:var(--orange);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button:hover{background:var(--orange-d)} button:disabled{opacity:.6;cursor:wait}
  #erro{min-height:20px;margin-top:12px;color:#B3261E;font-size:13px}
</style>
</head>
<body>
<form id="f">
  <h1>IBK KIDS — Escalas</h1>
  <p>Entre para acessar o sistema.</p>
  <label for="email">E-mail</label>
  <input id="email" type="email" autocomplete="username" required>
  <label for="senha">Senha</label>
  <input id="senha" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">Entrar</button>
  <div id="erro" role="alert"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const b = document.getElementById('b'), erro = document.getElementById('erro');
  b.disabled = true; erro.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: email.value, senha: senha.value})
    });
    if (r.ok) { location.href = '/'; return; }
    const d = await r.json().catch(() => ({}));
    erro.textContent = d.erro || 'Não foi possível entrar.';
  } catch (_) { erro.textContent = 'Sem conexão. Tente novamente.'; }
  b.disabled = false;
});
</script>
</body>
</html>
